ReleaseNotes: |-
  Materializr 1.7.7
  A first pass at sketch construction geometry, a whole-interface scale slider, more control over the sketch grid, and a round of fixes from tester reports.
  Added
  - Construction geometry (early version): a Construction button in the sketch tools turns selected lines, circles, arcs and splines into construction, or makes what you draw next construction; it draws dashed and teal and never affects the shape, extrudes or SVG/DXF export
  - Interface scale slider (Settings > Appearance, 75% to 250%) scales text, buttons, spacing and panels together; takes effect on restart
  - Scale grid with zoom switch and a Step switch size slider in the snap popup under the ViewCube
  - Grid rendering (experimental) in Settings > Rendering: workarounds for a grid that shimmers with anti-aliasing on some GPU drivers
  - Android: Full screen switch (Settings > Appearance)
  Changed
  - Rectangle and Circle choose their origin (Corner/Center, Center/2-Point) from a menu when you click the active tool again, replacing the extra Draw from button
  - Buttons that open a menu are marked with a small corner wedge
  - Sketch grid steps pass through 0.5 and 5 as you zoom (0.1, 0.5, 1, 5, 10); inch and foot grids keep whole steps
  - Frame rate follows your display; the VSync option is gone
  - The Working window draws over the last frame instead of blanking the viewport
  - Construction Plane stays open after a gizmo drag, with Apply and Cancel; the move is kept through undo and reload
  - Editing a sketch on a very heavy model rebuilds the body once when you finish the sketch instead of after every edit
  - Camera: leaving orthographic view no longer rolls or snaps
  Fixed
  - Lathe / Cut: a body picked after opening the dialog is no longer ignored
  - Android: the status bar stays visible and the menu bar sits below it on edge-to-edge tablets; with Full screen on, no blank strip is left
  - Android/iOS: the Working window sits over the last frame instead of a grey screen
  - Select-tool measurement labels show in the modern and touch layouts right after the app starts
  Thanks
  - Thanks to Iron47 on Discord for the bug reports that went into this release
ReleaseNotesUrl: https://github.com/materializr-cad/materializr/releases/tag/v1.7.7
